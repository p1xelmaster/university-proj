<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teachers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root{
            --primary:#4f46e5;
            --danger:#dc2626;
            --bg:#f3f4f6;
            --card:#ffffff;
            --border:#e5e7eb;
            --text:#111827;
            --muted:#6b7280;
        }
        body{
            font-family:Inter,Arial,sans-serif;
            background:var(--bg);
            margin:0;
            padding:40px 20px;
            color:var(--text);
        }
        .container{max-width:1100px;margin:auto;}
        .card{
            background:var(--card);
            padding:24px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
            margin-bottom:32px;
        }
        h1{margin-bottom:24px;}
        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:16px;
        }
        label{font-size:0.85rem;color:var(--muted);}
        input,select{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid var(--border);
        }
        button{
            padding:10px 16px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:500;
        }
        .btn-primary{background:var(--primary);color:white;}
        .btn-danger{background:var(--danger);color:white;}
        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
        }
        th,td{padding:14px;}
        th{background:#f9fafb;color:var(--muted);text-transform:uppercase;font-size:0.8rem;}
        tr:not(:last-child) td{border-bottom:1px solid var(--border);}
        ul{margin:0;padding-left:18px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Teachers</h1>

    <div class="card">
        <h2 th:text="${editMode}? 'Edit Teacher':'Create Teacher'"></h2>

        <form th:object="${form}"
              th:action="${editMode}? @{/teachers/{id}(id=${form.id})}:@{/teachers}"
              method="post">
            <input type="hidden" name="_method" value="PUT" th:if="${editMode}"/>

            <div class="form-grid">
                <div>
                    <label>Name</label>
                    <input type="text" th:field="*{teacherName}"/>
                </div>

                <div>
                    <label>Experience years</label>
                    <input type="number" th:field="*{experienceYears}"/>
                </div>

                <div>
                    <label>Department</label>
                    <select th:field="*{department}">
                        <option value="">Select department</option>
                        <option th:each="d:${departments}" th:value="${d}" th:text="${d}"></option>
                    </select>
                </div>

                <div>
                    <label>User</label>
                    <select th:field="*{userId}">
                        <option value="">Select user</option>
                        <option th:each="u:${users}" th:value="${u.id}" th:text="${u.userName}"></option>
                    </select>
                </div>

                <div>
                    <label>Courses</label>
                    <select multiple size="5" th:field="*{courseIds}">
                        <option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseName}"></option>
                    </select>
                </div>
            </div>

            <br>
            <button type="submit" class="btn-primary"
                    th:text="${editMode}? 'Update':'Create'"></button>
        </form>
    </div>

    <h2>All Teachers</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>User</th>
            <th>Department</th>
            <th>Courses</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="teacher:${teachers}">
            <td th:text="${teacher.id}"></td>
            <td th:text="${teacher.teacherName}"></td>
            <td th:text="${teacher.user.userName}"></td>
            <td th:text="${teacher.department}"></td>
            <td>
                <ul>
                    <li th:each="c:${teacher.courses}" th:text="${c.courseName}"></li>
                </ul>
            </td>
            <td>
                <form th:action="@{/teachers/{id}(id=${teacher.id})}" method="post">
                    <input type="hidden" name="_method" value="DELETE"/>
                    <button class="btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

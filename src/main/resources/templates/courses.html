<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
            --primary:#4f46e5;
            --danger:#dc2626;
            --bg:#f3f4f6;
            --card:#ffffff;
            --border:#e5e7eb;
            --text:#111827;
            --muted:#6b7280;
            --hover:#f9fafb;
        }
        body{
            font-family:Inter,Arial,sans-serif;
            background:var(--bg);
            margin:0;
            padding:40px 20px;
            color:var(--text);
        }
        .container{max-width:1100px;margin:auto;}
        .card{
            background:var(--card);
            padding:24px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
            margin-bottom:32px;
        }
        h1{margin-bottom:24px;}
        h2{margin-bottom:16px;}
        .form-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:16px;
        }
        label{font-size:0.85rem;color:var(--muted);}
        input,select{
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid var(--border);
        }
        button{
            padding:10px 16px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:500;
        }
        .btn-primary{background:var(--primary);color:white;}
        .btn-danger{background:var(--danger);color:white;}
        .table-card{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.05);
            display:block;
            overflow-x:auto;
        }
        th,td{
            padding:14px 16px;
            text-align:left;
            white-space:nowrap;
        }
        th{
            background:#f9fafb;
            color:var(--muted);
            text-transform:uppercase;
            font-size:0.8rem;
            position:sticky;
            top:0;
        }
        tr:hover{background:var(--hover);}
        .badge{
            display:inline-block;
            background:#e0e7ff;
            color:#4338ca;
            padding:2px 8px;
            border-radius:12px;
            font-size:0.75rem;
            margin:2px 2px 0 0;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>Courses</h1>

    <div class="card">
        <h2 th:text="${editMode}? 'Edit Course':'Create Course'"></h2>
        <form th:object="${form}" th:action="${editMode}? @{/courses/{id}(id=${form.id})}:@{/courses}" method="post">
            <input type="hidden" name="_method" value="PUT" th:if="${editMode}"/>

            <div class="form-grid">
                <div>
                    <label>Course Name</label>
                    <input type="text" th:field="*{courseName}"/>
                </div>

                <div>
                    <label>Credits</label>
                    <input type="number" th:field="*{credits}"/>
                </div>

                <div>
                    <label>Max Students</label>
                    <input type="number" th:field="*{maxStudents}"/>
                </div>

                <div>
                    <label>Teacher</label>
                    <select th:field="*{teacherId}">
                        <option value="">Select teacher</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.teacherName}"></option>
                    </select>
                </div>

                <div>
                    <label>Students</label>
                    <select multiple size="5" th:field="*{studentIds}">
                        <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.studentName}"></option>
                    </select>
                </div>
            </div>

            <br>
            <button type="submit" class="btn-primary" th:text="${editMode}? 'Update':'Create'"></button>
        </form>
    </div>

    <h2>All Courses</h2>
    <table class="table-card">
        <thead>
        <tr>
            <th>ID</th>
            <th>Course</th>
            <th>Teacher</th>
            <th>Students</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(courses)}">
            <td colspan="5" style="text-align:center">No courses yet.</td>
        </tr>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}"></td>
            <td th:text="${course.courseName}"></td>
            <td th:text="${course.teacher.teacherName}"></td>
            <td>
                <span th:if="${#lists.isEmpty(course.students)}">—</span>
                <span th:each="s : ${course.students}" class="badge" th:text="${s.studentName}"></span>
            </td>
            <td>
                <form th:action="@{/courses/{id}(id=${course.id})}" method="post">
                    <input type="hidden" name="_method" value="DELETE"/>
                    <button class="btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
